# Field config for the Raspberry Pi: the four bars, addressed from 1.

[site]
name = "Sunset"

# The console changes both of these live, and the change persists over the values here.
[sunset]
leg_s = 900  # orange to purple in 15 minutes; the way back takes the same
dusk_level = 0.35  # brightness at the purple end, relative to the orange end

[lighting]
driver = "enttec_open"  # Enttec Open DMX USB; "enttec_pro" for a DMX USB Pro
port = "auto"  # first FTDI widget; pin with /dev/serial/by-id/usb-ENTTEC_... if there are several
fps = 30

# Four ADJ Jolt Bar FX2 in 38CH mode (set on each bar's menu), 38 channels apiece,
# addressed back to back from 1.
[[lighting.fixtures]]
name = "bar-1"
type = "jolt_bar_fx2"
mode = "38ch"
address = 1

[[lighting.fixtures]]
name = "bar-2"
type = "jolt_bar_fx2"
mode = "38ch"
address = 39

[[lighting.fixtures]]
name = "bar-3"
type = "jolt_bar_fx2"
mode = "38ch"
address = 77

[[lighting.fixtures]]
name = "bar-4"
type = "jolt_bar_fx2"
mode = "38ch"
address = 115

[web]
enabled = true
host = "0.0.0.0"  # reachable from a phone on the Pi's hotspot; there is no login, so keep that network private
port = 7710
