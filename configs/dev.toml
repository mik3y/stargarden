# Developer config: a short sunset, and DMX out through an Enttec Open DMX USB
# if one is plugged in (the web console shows virtual fixtures either way).

[site]
name = "Sunset (dev)"

[sunset]
leg_s = 60  # orange to purple in a minute, so a whole cycle can be watched
dusk_level = 0.35

[lighting]
driver = "enttec_open"  # "console" for no hardware at all
port = "auto"  # or pin it, e.g. "/dev/cu.usbserial-B000E5T5"
fps = 30
peak = 0.8

# Four ADJ Jolt Bar FX2 in 38CH mode (set on each bar's menu), 38 channels apiece,
# addressed back to back from 1.
[[lighting.fixtures]]
name = "bar-1"
type = "jolt_bar_fx2"
mode = "38ch"
address = 1

[[lighting.fixtures]]
name = "bar-2"
type = "jolt_bar_fx2"
mode = "38ch"
address = 39

[[lighting.fixtures]]
name = "bar-3"
type = "jolt_bar_fx2"
mode = "38ch"
address = 77

[[lighting.fixtures]]
name = "bar-4"
type = "jolt_bar_fx2"
mode = "38ch"
address = 115

[web]
enabled = true  # http://127.0.0.1:7710/ once `bun run build` has been run in web/ (see README)
port = 7710
