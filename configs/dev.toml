# Developer config: stereo output, sensors faked from the console, and DMX out
# through an Enttec Open DMX USB if one is plugged in (the console still shows
# virtual fixtures either way).

[site]
name = "Stargarden (dev)"
latitude = 37.7749
longitude = -122.4194
timezone = "America/Los_Angeles"

[schedule]
enabled = false  # always "night"; toggle day/night with `n` in the console

[timers]
show_delay_s = 45
show_repeat_delay_s = 60
lights_out_s = 3
ambient_theme_rotation_s = 180

[audio]
backend = "auto"
mode = "stereo"

[discretes]
min_interval_s = 8
max_interval_s = 25

[lighting]
driver = "enttec_open"  # "console" for no hardware at all
port = "auto"  # or pin it, e.g. "/dev/cu.usbserial-B000E5T5"
fps = 30
peak = 1.0  # brightness ceiling for the themes; tab to "peak" in the console and nudge with [ ]

[[lighting.fixtures]]
name = "tree-nw"
type = "generic"
mode = "dim_rgbw"
address = 100
position = [-0.8, 0.8]

[[lighting.fixtures]]
name = "tree-ne"
type = "generic"
mode = "dim_rgbw"
address = 106
position = [0.8, 0.8]

[[lighting.fixtures]]
name = "tree-sw"
type = "generic"
mode = "dim_rgbw"
address = 111
position = [-0.8, -0.8]

[[lighting.fixtures]]
name = "tree-se"
type = "generic"
mode = "dim_rgbw"
address = 116
position = [0.8, -0.8]

[[lighting.fixtures]]
name = "sky"
type = "jolt_bar_fx2"
mode = "38ch"  # set the same mode on the bar's menu
address = 1
position = [0.0, 1.0]

[lightning]
mean_interval_s = 120  # dev: storms every couple of minutes while someone is on the platform
min_interval_s = 30
thunder_delay_s = [0.3, 2.5]

[presence]
source = "simulated"
vacancy_timeout_s = 120

[assets]
root = "../assets-dev"
